name: Lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# One lint run per ref at a time; a newer push supersedes an in-flight run.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tool versions are pinned here rather than taken from the runner image: this
# workflow also runs on push to master, and a runner image roll must not be
# able to turn master red on code nobody touched. Bump these deliberately.
env:
  SHELLCHECK_VERSION: v0.11.0
  YAMLLINT_VERSION: 1.38.0

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          docker run --rm -v "${PWD}:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
            bin/*.sh deploy/steam-login.sh

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run yamllint
        run: |
          python3 -m venv "${RUNNER_TEMP}/yamllint"
          "${RUNNER_TEMP}/yamllint/bin/pip" install --quiet \
            "yamllint==${YAMLLINT_VERSION}"
          "${RUNNER_TEMP}/yamllint/bin/yamllint" \
            .github/workflows/ deploy/docker-compose.yml

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # hadolint version comes from the action tag, which Dependabot bumps
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
