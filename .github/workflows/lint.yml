name: Lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# One lint run per ref at a time; a newer push supersedes an in-flight run.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # shellcheck ships with the GitHub-hosted ubuntu runner image
      - name: Run shellcheck
        run: shellcheck bin/*.sh deploy/steam-login.sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pipx install yamllint

      - name: Run yamllint
        run: yamllint .github/workflows/ deploy/docker-compose.yml

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
