volumes:
  ark-data:
  ark-cluster:

services:
  server:
    restart: always
    container_name: ${COMPOSE_PROJECT_NAME}_server
    image: hermsi/ark-server:latest
    # Give the server enough time to broadcast, save the world and shut down
    # gracefully before docker sends SIGKILL (default would be 10s)
    stop_grace_period: 5m
    # The image brings its own health check (see the README section "Health
    # check"). It stays "starting" until the servers are up, which on a fresh
    # volume includes the ~25GB download. Uncomment to change the timings or
    # to switch it off.
    #healthcheck:
    #  interval: 1m
    #  timeout: 45s
    #  start_period: 6h
    #  retries: 5
    # If you want to build from fresh source every "docker-compose up" ...
    # ... remove the "image:"-key and uncomment the following two lines:
    #build:
    #  context: ../.
    volumes:
      # # This setup is necessary if you have to download a non-anonymous appID/modID
      #- ${STEAM_SESSION_VOLUME}:/home/steam/Steam
      - ${ARK_SERVER_VOLUME}:/app
      # # Share this volume (and CLUSTER_ID) between containers to form a cluster,
      # # see the README section "Cluster and multi-map support"
      #- ${ARK_CLUSTER_VOLUME}:/cluster
    environment:
      # # This setup is necessary if you have to download a non-anonymous appID/modID
      #- STEAM_LOGIN=${STEAM_LOGIN}
      - SESSION_NAME=${SESSION_NAME}
      - SERVER_MAP=${SERVER_MAP}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAX_PLAYERS=${MAX_PLAYERS}
      - UPDATE_ON_START=${UPDATE_ON_START}
      - BACKUP_ON_STOP=${BACKUP_ON_STOP}
      - PRE_UPDATE_BACKUP=${PRE_UPDATE_BACKUP}
      - WARN_ON_STOP=${WARN_ON_STOP}
      - GAME_MOD_IDS=${GAME_MOD_IDS}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - ARK_EXTRA_OPTS=${ARK_EXTRA_OPTS}
      # Set DISCORD_WEBHOOK_URL in your .env file to get notifications,
      # see the README section "Discord notifications"
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Size budget for /app/backup, see the README section "Backup retention"
      - MAX_BACKUP_SIZE_MB=${MAX_BACKUP_SIZE_MB:-}
      # Restart an instance that crashes before it finished starting,
      # see the README section "Crash restarts" first, this can loop
      - ALWAYS_RESTART_ON_CRASH=${ALWAYS_RESTART_ON_CRASH:-}
      # # Health check behaviour, see the README section "Health check"
      #- DISABLE_HEALTHCHECK=true
      #- HEALTHCHECK_REQUIRE_ALL_INSTANCES=true
      # # Escape hatch for a broken ARK update, see the README section
      # # "Pin the server to a Steam manifest"
      #- TARGET_MANIFEST_ID=${TARGET_MANIFEST_ID}
      # # Cluster / multi-map settings, see the README section
      # # "Cluster and multi-map support" for all SUB_<KEY>_* variables
      #- CLUSTER_ID=MyCluster
      #- SUB_INSTANCE_KEYS=Fjordur,Caballus_P
      #- SUB_Caballus_P_SERVER_MAP_MOD_ID=1679826889
    ports:
      # Port for connections from ARK game client
      - "7777:7777/udp"
      # Raw UDP socket port (always Game client port +1
      - "7778:7778/udp"
      # RCON management port
      - "27020:27020/tcp"
      # Steam's server-list port
      - "27015:27015/udp"
    networks:
      - default
